<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Superlicença</title>
  <link rel="icon" type="image/png" href="img/icone.png">
  <link rel="apple-touch-icon" href="img/icone-180.png">
  <meta name="theme-color" content="#070e1c">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topo">
    <div class="marca"><img class="marca-logo" src="img/logo-barra.png" alt="Superlicença" width="1000" height="146"></div>
    <button class="sair-topo" id="sair-topo" data-sair hidden>Sair do jogo</button>
    <div id="status" class="status"></div>
  </header>
  <main id="app"></main>
  <div id="aviso" class="toast" role="status" hidden></div>

  <!-- Ponte com o iPhone (@capacitor/core): o build copia para www/. No navegador o arquivo não existe e o jogo segue sem ele. -->
  <script src="capacitor.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/i18n-en-dados.js"></script>
  <script src="js/i18n-en-kart.js"></script>
  <script src="js/i18n-en-carreira.js"></script>
  <script src="js/i18n-en-corrida.js"></script>
  <script src="js/i18n-en-ui.js"></script>
  <script src="js/i18n-en-dicas.js"></script>
  <script>BoxI18n.iniciar();</script>
  <script src="js/armazenamento.js"></script>
  <script src="js/premium.js"></script>
  <script src="js/anuncios.js"></script>
  <script src="js/data.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/kart.js"></script>
  <script src="js/carreira.js"></script>
  <script src="js/carro3d.js"></script>
  <script src="js/trofeu3d.js"></script>
  <script src="js/dicas-arte.js"></script>
  <script src="js/dicas.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
